[project]
name = "reltrade"
version = "0.1.0"
description = "Headless relativistic interstellar trade experiment with LLM merchants"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "black>=24", "isort>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, pure-logic tests",
    "integration: multi-module simulation tests (no network)",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/reltrade/prompts.py" = ["E501"]  # 提示词正文
"src/reltrade/report.py" = ["E501"]  # 中文报告正文（全角字符按双宽计）
